<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: an 824 x 824 rounded square centered on the 1024 canvas, with a drop shadow. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C8DF6"/>
      <stop offset="1" stop-color="#2B3FA6"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A66"/>
      <stop offset="1" stop-color="#F0443A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#101A4D" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#background)" filter="url(#shadow)"/>
  <!-- A list of registered apps: an app tile and its name on each row. -->
  <g fill="#FFFFFF">
    <rect x="250" y="262" width="120" height="120" rx="30"/>
    <rect x="410" y="300" width="364" height="44" rx="22"/>
    <rect x="250" y="642" width="120" height="120" rx="30"/>
    <rect x="410" y="680" width="300" height="44" rx="22"/>
  </g>
  <!-- The stale row, faded, with the badge that removes it. -->
  <g fill="#FFFFFF" opacity="0.4">
    <rect x="250" y="452" width="120" height="120" rx="30"/>
    <rect x="410" y="490" width="190" height="44" rx="22"/>
  </g>
  <g filter="url(#badgeShadow)">
    <circle cx="704" cy="512" r="84" fill="url(#badge)"/>
    <rect x="656" y="499" width="96" height="26" rx="13" fill="#FFFFFF"/>
  </g>
</svg>
